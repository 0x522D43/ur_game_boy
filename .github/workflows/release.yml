name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y make wget zip

      - name: Install GBDK-4
        run: |
          wget -q https://github.com/gbdk-2020/gbdk-2020/releases/latest/download/gbdk-linux64.tar.gz
          tar -xzf gbdk-linux64.tar.gz
          echo "GBDKDIR=$PWD/gbdk/" >> "$GITHUB_ENV"
          echo "$PWD/gbdk/bin" >> "$GITHUB_PATH"

      - name: Build ROM
        run: make

      - name: Package ROM
        run: |
          mkdir -p dist
          cp main.gb dist/main.gb
          sha256sum main.gb > dist/main.gb.sha256
          zip -j "dist/ur-game-boy-${GITHUB_REF_NAME}.zip" main.gb

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/main.gb
            dist/main.gb.sha256
            dist/ur-game-boy-${{ github.ref_name }}.zip